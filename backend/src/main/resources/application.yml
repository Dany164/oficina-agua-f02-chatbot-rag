spring:
  application:
    name: chatbot-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:chatbot}
    username: ${POSTGRES_USER:chatbot}
    password: ${POSTGRES_PASSWORD:}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen2.5:3b}
          num-ctx: 4096
          temperature: ${OLLAMA_CHAT_TEMPERATURE:0.1}
      embedding:
        options:
          model: ${OLLAMA_EMBEDDING_MODEL:bge-m3}
    vectorstore:
      pgvector:
        initialize-schema: false
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        table-name: vector_store
chatbot:
  ingestion:
    knowledge-path: ${KNOWLEDGE_PATH:../knowledge}
  rate-limit:
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:10}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}
    trust-forwarded-for: ${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
  rag:
    top-k: ${RAG_TOP_K:4}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.55}
    max-context-chars: ${RAG_MAX_CONTEXT_CHARS:6000}